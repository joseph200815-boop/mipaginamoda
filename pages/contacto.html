<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Moda Urbana</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="../index.html">
                Moda Urbana
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="servicios.html">
                            Servicios
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contenido principal -->
    <main>

        <section class="container py-5">

            <h1 class="text-center mb-4">
                Contáctanos
            </h1>

            <p class="text-center mb-5">
                Déjanos tus datos y nos pondremos en contacto contigo.
            </p>


            <!-- Formulario -->
            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-6">

                    <form>

                        <!-- Nombre -->
                        <div class="mb-3">

                            <label for="nombre" class="form-label">
                                Nombre completo
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   name="nombre"
                                   placeholder="Escribe tu nombre"
                                   required>

                        </div>


                        <!-- Correo -->
                        <div class="mb-3">

                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="correo"
                                   name="correo"
                                   placeholder="ejemplo@correo.com"
                                   required>

                        </div>


                        <!-- Teléfono -->
                        <div class="mb-3">

                            <label for="telefono" class="form-label">
                                Teléfono
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="telefono"
                                   name="telefono"
                                   placeholder="Escribe tu teléfono"
                                   required>

                        </div>


                        <!-- Mensaje -->
                        <div class="mb-3">

                            <label for="mensaje" class="form-label">
                                Mensaje
                            </label>

                            <textarea class="form-control"
                                      id="mensaje"
                                      name="mensaje"
                                      rows="5"
                                      placeholder="Escribe tu mensaje"
                                      required></textarea>

                        </div>


                        <!-- Botón -->
                        <div class="d-grid">

                            <button type="button"
        class="btn btn-dark"
        id="botonEnviar">
    Enviar mensaje
</button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-4">

        <p class="mb-0">
            &copy; 2026 Moda Urbana - Todos los derechos reservados.
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

    function validar() {

        let nombre = document.getElementById("nombre").value;

        if (nombre.trim() === "") {

            alert("Error: debes ingresar tu nombre.");

        } else {

            alert("¡Hola, " + nombre + "! Gracias por contactar a Moda Urbana.");

        }

    }

    document.getElementById("botonEnviar").addEventListener("click", validar);

</script>

</body>

</html>
